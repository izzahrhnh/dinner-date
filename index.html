<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8ece0">
  <meta name="description" content="A birthday scrapbook — letters, photos and little films from the crew.">
  <title>Happy birthday</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='6' y='4' width='28' height='32' rx='1' fill='%23fffdf7' stroke='%232b2a3a' stroke-width='2'/%3E%3Crect x='10' y='8' width='20' height='18' fill='%23c9d4bd'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Nanum+Pen+Script&family=Courier+Prime:wght@400;700&family=Abril+Fatface&family=Archivo+Black&family=Rubik+Mono+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="memories.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="grain" aria-hidden="true"><filter id="grain-f"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grain-f)"/></svg>

  <main>
    <!-- Cover -->
    <header class="cover" id="top">
      <h1 class="ransom" data-ransom aria-label="Happy birthday"></h1>
      <p class="her-name"><span data-name>you</span></p>

      <div class="stack" data-stack>
        <button class="stack-hit" type="button" aria-label="Show the next photo"></button>
      </div>
      <p class="pen-note stack-hint">tap the photos</p>

      <p class="hero-line" data-hero-line></p>

      <div class="sticky-note" data-countdown-wrap>
        <p data-countdown></p>
      </div>
    </header>

    <!-- Your note -->
    <section class="page" id="note" aria-labelledby="note-title">
      <h2 class="page-title" id="note-title">A note from me</h2>
      <article class="lined-letter">
        <span class="tape tape-tl" aria-hidden="true"></span>
        <figure class="clip-photo" data-note-photo><span class="paperclip" aria-hidden="true"></span></figure>
        <div class="letter-text" data-my-note></div>
        <p class="signature" data-signature></p>
      </article>
    </section>

    <!-- Letters -->
    <section class="page" id="letters" aria-labelledby="letters-title">
      <h2 class="page-title" id="letters-title">Letters from the crew</h2>
      <p class="page-sub" data-letters-hint>Tap an envelope to open it.</p>
      <div class="envelopes" id="envelopes"></div>
    </section>

    <!-- The roll -->
    <section class="page page-wide" id="roll" aria-labelledby="roll-title">
      <h2 class="page-title" id="roll-title">The roll so far</h2>
      <p class="page-sub">Hung up to dry, oldest first. Swipe along.</p>
      <div class="line-wrap">
        <div class="clothesline" id="clothesline" tabindex="0" aria-label="Our memories, in order"></div>
      </div>
    </section>

    <!-- Our film -->
    <section class="page" id="film" aria-labelledby="film-title">
      <h2 class="page-title" id="film-title">Our film</h2>
      <p class="page-sub" data-film-sub>Little videos from everyone, played one after another.</p>
      <div class="screen">
        <span class="tape tape-tl" aria-hidden="true"></span>
        <span class="tape tape-br" aria-hidden="true"></span>
        <div class="screen-inner" id="screen">
          <video id="reel-video" playsinline controls preload="metadata" hidden></video>
          <p class="screen-empty" data-screen-empty>The films are still developing.</p>
        </div>
        <div class="reel-controls">
          <button type="button" class="pill" data-reel="prev" hidden>Previous</button>
          <p class="reel-label" data-reel-label></p>
          <button type="button" class="pill" data-reel="next" hidden>Next</button>
        </div>
      </div>
    </section>

    <!-- Wish -->
    <section class="page wish-page" aria-labelledby="wish-title">
      <h2 class="page-title" id="wish-title">Make a wish</h2>
      <button class="cake" type="button" aria-pressed="false" aria-label="Blow out the candle">
        <span class="flame" aria-hidden="true"></span>
        <span class="smoke" aria-hidden="true"></span>
        <span class="candle" aria-hidden="true"></span>
        <span class="cake-top" aria-hidden="true"></span>
        <span class="cake-body" aria-hidden="true"></span>
      </button>
      <p class="pen-note" data-wish-hint>tap the candle to blow it out</p>
      <p class="colophon" data-colophon></p>
    </section>
  </main>

  <dialog class="postcard" id="letter" aria-labelledby="letter-title">
    <button class="close" type="button" data-close aria-label="Close letter">×</button>
    <div class="postcard-media" data-letter-media></div>
    <div class="postcard-body">
      <h3 id="letter-title"></h3>
      <div data-letter-body></div>
      <p class="signature" data-letter-sign></p>
    </div>
  </dialog>
</body>
</html>
